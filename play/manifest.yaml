# Google Play store listing + release manifest для FIXXE. Секретов здесь нет.
# Читается `play-ops metadata push`, `graphics upload` и `promote --to production`.
#
# ВАЖНО: все тексты — только на английском (их видит пользователь магазина).
# release.sh падает, если находит кириллицу в текстах для магазинов.

default_locale: en-US

contact:
  email: innovation@karpinity.com
  website: https://telebimmer.com/fixxe/

category: FINANCE

release:
  # Первый релиз приложения Google принимает только как draft: публикацию
  # подтверждают кнопкой в Play Console. Поэтапный раскат на draft-приложении
  # тоже запрещён — он станет доступен со второго релиза.
  status: draft
  # rollout_fraction: 0.2   # включить после первой публикации

graphics:
  icon: icon-512.png
  feature_graphic: feature-1024x500.png
  phone_screenshots:
    - phone-1.png
    - phone-2.png
    - phone-3.png
    - phone-4.png
  tablet_screenshots:
    - tablet-1.png
    - tablet-2.png
    - tablet-3.png
    - tablet-4.png

# Зеркало ответов из Play Console (у Google нет write-API для этих разделов).
content_rating:
  violence: none
  sexual_content: none
  language: none
  controlled_substances: none
  gambling: false
  user_generated_content: false

data_safety:
  collects_personal_info: false
  shares_data_with_third_parties: false
  data_encrypted_in_transit: true
  data_deletion_supported: false

pricing:
  free: true
  tier: null

locales:
  en-US:
    title: "FIXXE"
    short_description: "Live mid-market rates from 3 sources, 300+ currencies, offline, no ads."
    full_description: |
      FIXXE is a fast, clean currency converter with live mid-market exchange rates — the neutral midpoint between global buy and sell prices, not bank spreads.

      WHY FIXXE IS DIFFERENT

      • Three rate sources with automatic fallback — ExchangeRate-API, F.A. and Frankfurter (ECB), plus eight mirrors. If a provider is down, the app quietly switches to the next one and shows which source the numbers came from. Most converters depend on a single API and simply show nothing when it fails.

      • Works offline — the last rates are kept on your device, so the app keeps converting with no connection. And if those rates are more than a day old, it says so plainly instead of pretending they are current.

      • Smart rounding — your chosen precision is a minimum, not a straitjacket: if rounding would distort the amount by more than 2%, extra decimals are added automatically. 0.94 CHF never becomes "1", and small crypto amounts never collapse to zero.

      • Dynamic base — rates are recalculated against the currency you are editing, not a fixed one. No switching back and forth.

      • No ads. No accounts. No tracking. The only permission is internet access; your list, order and settings never leave your device.

      CURRENCIES

      • 300+ currencies with country flags
      • Regional currencies that converters often skip: Russian ruble, Serbian dinar, Georgian lari, Tajikistani somoni, Kyrgyz som
      • Crypto — Bitcoin, Ethereum and 150+ more — and precious metals

      EVERYDAY DETAILS

      • Type in any field and every other currency updates instantly
      • Drag rows by the handle to reorder them, remove one with a single tap
      • Source-aware search: filter currencies by provider, see where each one is available, switch source in one tap
      • Precision: whole numbers, 1, 2 or 4 decimals
      • 40 languages, English by default, with an option to follow your device language — right-to-left layouts included
      • Phone, tablet and web: the same app on iPhone, iPad, Android and as a web app you can install to the home screen

      Displayed rates are mid-market reference values, not real-time trading quotes.
      Rates By Exchange Rate API.
    recent_changes: |
      Tablet support: the currency list now stays at a readable width instead of stretching across the whole screen.

      Also in this release: English is the default language (your device language is available as an option), country flags for all fiat currencies, and drag-to-reorder.
