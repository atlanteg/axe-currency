name: FIXXE
options:
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
targets:
  FIXXE:
    type: application
    platform: iOS
    sources:
      - FIXXE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karpinity.fixxe
        MARKETING_VERSION: "1.46"
        CURRENT_PROJECT_VERSION: "46"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FIXXE
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone — только портрет; iPad должен поддерживать все ориентации
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
  FIXXEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FIXXEUITests
    dependencies:
      - target: FIXXE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karpinity.fixxe.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
